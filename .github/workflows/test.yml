name: Unit and Integration Tests

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Levantamos MongoDB como un servicio dentro de GitHub Actions
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r src/api/requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Ejecutar Pruebas
      env:
        # Variables requeridas por la función _require_env en main.py[cite: 1]
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        SPOTIFY_REDIRECT_URI: "http://localhost:5173/callback"
        TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        # URI para conectar al servicio de mongo arriba definido
        MONGO_URI: "mongodb://localhost:27017"
        MONGO_DB: "test_db"
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src/api
        pytest tests/