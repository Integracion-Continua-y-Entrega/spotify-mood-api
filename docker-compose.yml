services:
  backend:
    image: zs23017378/spotify-mood-api-backend:latest 
    container_name: spotify_backend
    ports:
      - "8000:8000"
    env_file:
      - ./src/api/.env
    # volumes:
    #   - ./src/api:/app
    restart: unless-stopped

  frontend:
    image: zs23017378/spotify-mood-api-frontend:latest 
    container_name: spotify_frontend
    ports:
      - "5173:5173"   
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

