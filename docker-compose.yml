services:
  # Base de Datos
  mongodb:
    image: mongo:latest
    container_name: spotify_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Backend (FastAPI)
  backend:
    build: 
      context: ./src/api  # <--- IMPORTANTE: Usamos la ruta real
      dockerfile: Dockerfile
    container_name: spotify_backend
    ports:
      - "8000:8000"
    env_file:
      - ./src/api/.env    # <--- IMPORTANTE: Apuntamos al archivo que acabas de crear
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=spotify_mood_db

  # Frontend (React/Vite) - ¡LA PARTE NUEVA!
  frontend:
    build: 
      context: ./frontend
    container_name: spotify_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  mongo-data: