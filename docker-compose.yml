services:
  # Backend (FastAPI)
  backend:
    build: 
      context: ./src/api 
      dockerfile: Dockerfile
    container_name: spotify_backend
    ports:
      - "8000:8000"
    env_file:
      - ./src/api/.env   

  # Frontend (React/Vite)
  frontend:
    build: 
      context: ./frontend
    container_name: spotify_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

